<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anuncio de Vacaciones</title>
    <style>
        /* Estilos del panel emergente (modal) */
        .modal {
            display: none; /* Oculto por defecto */
            position: fixed; /* Fijo en la pantalla */
            z-index: 1000; /* Por encima de otros elementos */
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto; /* Permite desplazamiento si el contenido es largo */
            background-color: rgba(0, 0, 0, 0.6); /* Fondo semi-transparente */
            backdrop-filter: blur(5px); /* Efecto de desenfoque en el fondo */
            -webkit-backdrop-filter: blur(5px); /* Para compatibilidad con Safari */
        }

        .modal-content {
            background-color: #fefefe; /* Fondo blanco del contenido */
            margin: 15% auto; /* Centra el modal vertical y horizontalmente */
            padding: 25px;
            border: 1px solid #888;
            width: 90%;
            max-width: 450px; /* Ancho máximo para el contenido */
            border-radius: 12px; /* Esquinas redondeadas */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); /* Sombra suave */
            font-family: Arial, sans-serif; /* Fuente del texto */
            text-align: center;
            animation: fadeInScale 0.4s ease-out; /* Animación de aparición */
        }
        
        /* Animación para la aparición del modal */
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .close-btn {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            line-height: 1;
        }

        .close-btn:hover,
        .close-btn:focus {
            color: #000;
            text-decoration: none;
            cursor: pointer;
        }
        
        .modal-header {
            border-bottom: 1px solid #ddd; /* Línea separadora en el encabezado */
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        
        .modal-header h2 {
            margin: 0;
            color: #333;
            font-size: 24px;
        }

        .modal-body p {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 5px;
        }

        .modal-body strong {
            color: #d9534f; /* Color para texto resaltado, como "Estamos de vacaciones." */
        }
    </style>
</head>
<body>

<!-- El panel de ventana emergente (modal) -->
<div id="vacationModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span class="close-btn">&times;</span> <!-- Botón de cierre (X) -->
            <h2>¡Aviso Importante!</h2>
        </div>
        <div class="modal-body">
            <p><strong>Estamos de vacaciones.</strong></p>
            <p>Estaremos fuera desde el **19 de agosto** hasta el **2 de septiembre**.</p>
            <p>Durante este período, estaremos cerrados.</p>
            <p>¡Volvemos con toda la energía el **3 de septiembre**!</p>
        </div>
    </div>
</div>

<script>
    // Fechas de inicio y fin de las vacaciones.
    // Configurado para Agosto de 2025.
    const startDate = new Date('2025-08-19T00:00:00'); // 19 de agosto de 2025, 00:00:00
    const endDate = new Date('2025-09-02T23:59:59');   // 2 de septiembre de 2025, 23:59:59
    const now = new Date(); // Fecha y hora actual

    // Obtener una referencia al elemento modal y al botón de cierre
    const modal = document.getElementById('vacationModal');
    const closeBtn = document.getElementsByClassName('close-btn')[0];

    // Función para mostrar el modal si la fecha actual está dentro del período de vacaciones
    function showModalIfOnVacation() {
        if (now >= startDate && now <= endDate) {
            modal.style.display = 'block'; // Muestra el modal
        }
    }

    // Cuando el usuario hace clic en el botón de cierre (X), el modal se oculta
    closeBtn.onclick = function() {
        modal.style.display = 'none';
    }

    // Cuando el usuario hace clic en cualquier lugar fuera del contenido del modal, el modal también se oculta
    window.onclick = function(event) {
        if (event.target === modal) {
            modal.style.display = 'none';
        }
    }

    // Llama a la función para verificar y mostrar el modal cuando la página se carga
    showModalIfOnVacation();
</script>

</body>
</html>
