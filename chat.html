<div id="chat-toggle-button" title="Abrir Chat">
    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
</div>
<div id="chat-container">
    <div id="chat-header">
        <h3>Asistente Virtual</h3>
        <button id="close-chat-btn" title="Cerrar Chat">×</button>
    </div>
    <div id="chat-messages-container">
        <div class="message bot-message">
            ¡Hola! Soy el asistente de Yoselin Magia y Color. ¿Cómo puedo ayudarte hoy?
        </div>
    </div>
    <div id="chat-input-area">
        <input type="text" id="user-chat-input" placeholder="Escribe un mensaje...">
        <button id="send-chat-button" title="Enviar Mensaje">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>
</div>
