<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios - Yoselin Magia y Color</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500&family=Tangerine:wght@700&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="Logo.png">
    <link rel="apple-touch-icon" href="Logo.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-[#3A3226]">

    <header id="navbar-placeholder"></header>

    <main>
        <section class="bg-[#F5F1E9] pt-32 pb-16 sm:pt-40 sm:pb-24">
            <div class="max-w-screen-xl mx-auto px-6 lg:px-8 text-center">
                <h1 class="text-4xl md:text-5xl font-bold leading-tight tracking-tight">Nuestros Servicios</h1>
                <p class="mt-4 text-lg md:text-xl max-w-3xl mx-auto text-[#6B5E4F]">Ofrecemos un servicio personalizado y utilizamos productos de alta gama para un resultado excepcional.</p>
            </div>
        </section>

        <section id="lista-servicios" class="py-16 sm:py-20 bg-[#FDFBF6]">
            <div class="max-w-screen-xl mx-auto px-6 lg:px-8">
                <div id="coloracion" class="mb-12 scroll-mt-24">
                    <h2 class="text-3xl font-bold border-b-2 border-[var(--border-warm)] pb-4 mb-6">Coloración</h2>
                    <div class="space-y-4">
                        <div class="service-item bg-[#F5F1E9] rounded-lg"><button class="w-full flex justify-between items-center p-4 text-left"><h4 class="font-semibold">Baño de Color</h4><svg class="w-5 h-5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></button><div class="service-details px-4"><div class="border-t border-gray-200 pt-2"><div class="flex justify-between items-center py-2"><div>Pelo Largo<p class="text-sm text-gray-500">30 min</p></div><span class="font-bold accent-text">45€</span></div><div class="flex justify-between items-center py-2 border-t border-gray-200"><div>Pelo Medio<p class="text-sm text-gray-500">30 min</p></div><span class="font-bold accent-text">30€</span></div></div></div></div>
                        </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    <div id="chat-placeholder"></div>

    <script src="script.js"></script>
</body>
</html>
