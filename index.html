    <!-- ESTRUCTURA DEL CHAT (HTML) - Tu diseño original -->
    <div class="chat-container" id="chat-container">
        <div class="chat-header" id="chat-header">
            <span>Asistente de Yoselin</span>
            <span id="close-chat-btn" style="font-size: 24px; line-height: 1; cursor: pointer;">&times;</span>
        </div>
        <div class="chat-messages" id="chat-messages-container">
            <div class="message bot-message">¡Hola! Soy Nexmaia, tu asistente virtual en Yoselin Magia y Color. ¿Cómo puedo ayudarte?</div>
        </div>
        <div class="chat-input">
            <input type="text" id="user-chat-input" placeholder="Escribe tu mensaje...">
            <button id="send-chat-button" aria-label="Enviar mensaje">Enviar</button>
        </div>
    </div>

    <div class="chat-toggle-button" id="chat-toggle-button">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
    </div>

    <!-- LÓGICA DEL CHAT Y DE LA PÁGINA (JAVASCRIPT) -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // --- SCRIPTS GENERALES DE LA PÁGINA ---
        const menuButton = document.querySelector('[data-collapse-toggle="navbar-sticky"]');
        const navbar = document.getElementById('navbar-sticky');
        if(menuButton) {
            menuButton.addEventListener('click', () => navbar.classList.toggle('hidden'));
        }
        
        document.querySelectorAll('a[href*="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                const href = this.getAttribute('href');
                if (href === '#') {
                    e.preventDefault();
                    return;
                }
                if (href.startsWith('#')) {
                    e.preventDefault();
                    const targetElement = document.querySelector(href);
                    if(targetElement) { 
                        targetElement.scrollIntoView({ behavior: 'smooth' }); 
                    }
                    if (navbar && !navbar.classList.contains('hidden')) { 
                        navbar.classList.add('hidden'); 
                    }
                }
            });
        });

        // --- LÓGICA DEL CHAT CONECTADO A N8N ---
        const webhookUrl = 'https://nexmaia.app.n8n.cloud/webhook/c9ae2baa-d103-4cb4-9dac-837ba2049a0a'; // Asegúrate de que esta URL es la de PRODUCCIÓN de tu Webhook
        
        const chatContainer = document.getElementById('chat-container');
        const chatToggleButton = document.getElementById('chat-toggle-button');
        const closeChatBtn = document.getElementById('close-chat-btn');
        const chatMessages = document.getElementById('chat-messages-container');
        const userInput = document.getElementById('user-chat-input');
        const sendButton = document.getElementById('send-chat-button');
        const pedirCitaButtons = document.querySelectorAll('.js-pedir-cita');

        let sessionId = localStorage.getItem('chatSessionId') || 'session_' + Date.now();
        localStorage.setItem('chatSessionId', sessionId);

        const openChat = () => {
            chatContainer.classList.add('visible');
            chatToggleButton.style.display = 'none';
        };

        const closeChat = () => {
            chatContainer.classList.remove('visible');
            chatToggleButton.style.display = 'flex';
        };

        chatToggleButton.addEventListener('click', openChat);
        closeChatBtn.addEventListener('click', closeChat);

        const addMessage = (text, className) => {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', className);
            messageElement.textContent = text;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageElement;
        };

        const handleSendMessage = async () => {
            const messageText = userInput.value.trim();
            if (messageText === '') return;

            addMessage(messageText, 'user-message');
            userInput.value = '';
            const typingIndicator = addMessage('Nexmaia está escribiendo...', 'typing-indicator');

            try {
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chatInput: messageText,
                        sessionId: sessionId
                    })
                });

                if (!response.ok) throw new Error(`Error de red: ${response.status}`);

                const data = await response.json();
                
                if(typingIndicator.parentNode) {
                    chatMessages.removeChild(typingIndicator);
                }

                // CORRECCIÓN: Tu código original esperaba una clave "output".
                // Asegúrate de que tu workflow de n8n devuelve la respuesta en esta clave.
                if (data && data.output) {
                    addMessage(data.output, 'bot-message');
                } else {
                    // Fallback por si la respuesta no tiene el formato esperado
                    addMessage('Lo siento, no he podido procesar la respuesta.', 'bot-message');
                }
            } catch (error) {
                console.error('Error al contactar con el asistente:', error);
                if(typingIndicator && typingIndicator.parentNode) {
                    chatMessages.removeChild(typingIndicator);
                }
                addMessage('Ups, parece que hay un problema de conexión. Por favor, inténtalo de nuevo.', 'bot-message');
            }
        };

        sendButton.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                handleSendMessage();
            }
        });

        pedirCitaButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                e.preventDefault();
                openChat();
            });
        });
    });
    </script>
