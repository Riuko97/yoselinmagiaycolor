<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoselin Magia y Color - Peluquería y Estética Unisex en Rubí</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" sizes="32x32" href="Logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="Logo.png">
    <link rel="manifest" href="Logo.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500&family=Tangerine:wght@700&display=swap" rel="stylesheet">
    
    <!-- Hoja de estilos para el chat de n8n -->
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
</head>
<body class="text-[#3A3226]">

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="bg-[#FDFBF6]/80 backdrop-blur-md fixed w-full z-30 top-0 start-0 shadow-sm">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
            <a href="index.html" class="flex items-center space-x-3">
                <span class="text-3xl md:text-4xl font-bold text-[#3A3226] font-tangerine">Yoselin Magia y Color</span>
            </a>
            <div class="flex md:order-2">
                <a href="#" class="btn-accent font-semibold rounded-lg text-sm px-5 py-2.5 text-center js-pedir-cita">
                    Pedir Cita
                </a>
                <button data-collapse-toggle="navbar-sticky" type="button" class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200">
                    <span class="sr-only">Abrir menú</span>
                    <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/></svg>
                </button>
            </div>
            <div class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-sticky">
                <ul class="flex flex-col p-4 md:p-0 mt-4 font-medium border border-gray-100 rounded-lg bg-gray-50 md:space-x-8 md:flex-row md:mt-0 md:border-0 md:bg-transparent">
                    <li><a href="servicios.html" class="block py-2 px-3 rounded hover:bg-gray-100 md:hover:bg-transparent md:hover:text-[#C09553] md:p-0 transition-colors">Servicios</a></li>
                    <li><a href="galeria.html" class="block py-2 px-3 rounded hover:bg-gray-100 md:hover:bg-transparent md:hover:text-[#C09553] md:p-0 transition-colors">Galería</a></li>
                    <li><a href="#contacto" class="block py-2 px-3 rounded hover:bg-gray-100 md:hover:bg-transparent md:hover:text-[#C09553] md:p-0 transition-colors">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <main>
        <!-- ... TODO TU CONTENIDO PRINCIPAL ... -->
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#FDFBF6] border-t border-[var(--border-warm)]">
        <!-- ... Contenido del footer ... -->
    </footer>
    
    <!-- =================================================================== -->
    <!-- CÓDIGO DEL CHATBOT DE N8N - VERSIÓN FINAL -->
    <!-- Este script crea la burbuja, la ventana y se conecta a tu workflow. -->
    <!-- =================================================================== -->
    <script type="module">
        import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

        createChat({
            webhookUrl: 'https://nexmaia.app.n8n.cloud/webhook/c9ae2baa-d103-4cb4-9dac-837ba2049a0a/chat',
            
            // Personalización de los textos en español
            defaultLanguage: 'es',
            initialMessages: [
                '¡Hola! 👋',
                'Soy NEXMAIA, tu asistente virtual en Yoselin Magia y Color. ¿Cómo puedo ayudarte hoy?'
            ],
            i18n: {
                es: {
                    title: 'Asistente Yoselin',
                    subtitle: "Inicia un chat para reservar tu cita.",
                    inputPlaceholder: 'Escribe tu mensaje...',
                    getStarted: 'Nueva Conversación'
                },
            },
            // Personalización de colores para que coincida con tu web
            theme: {
                '--chat--color-primary': '#C09553', // Dorado para la burbuja y mensajes del usuario
                '--chat--color-secondary': '#F5F1E9', // Beige para los mensajes del bot
                '--chat--color-text-on-primary': '#3A3226', // Texto marrón oscuro
                '--chat--color-text-on-secondary': '#3A3226', // Texto marrón oscuro
                '--chat--header--background': '#3A3226', // Cabecera marrón oscuro
                '--chat--header--color': '#FDFBF6' // Texto de cabecera blanco roto
            }
        });
    </script>
    
    <script>
    // --- SCRIPTS GENERALES DE LA PÁGINA ---
    document.addEventListener('DOMContentLoaded', function() {
        const menuButton = document.querySelector('[data-collapse-toggle="navbar-sticky"]');
        const navbar = document.getElementById('navbar-sticky');
        if(menuButton) {
            menuButton.addEventListener('click', () => navbar.classList.toggle('hidden'));
        }
        
        document.querySelectorAll('a[href*="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                const href = this.getAttribute('href');
                if (href === '#') {
                    e.preventDefault();
                    return;
                }
                if (href.startsWith('#')) {
                    e.preventDefault();
                    const targetElement = document.querySelector(href);
                    if(targetElement) { 
                        targetElement.scrollIntoView({ behavior: 'smooth' }); 
                    }
                    if (navbar && !navbar.classList.contains('hidden')) { 
                        navbar.classList.add('hidden'); 
                    }
                }
            });
        });

        // --- LÓGICA PARA ABRIR EL CHAT DESDE LOS BOTONES "PEDIR CITA" ---
        const pedirCitaButtons = document.querySelectorAll('.js-pedir-cita');
        
        const openN8nChat = () => {
            const n8nChatToggleButton = document.querySelector('#n8n-chat-toggle-button');
            if (n8nChatToggleButton) {
                // Si la ventana de chat no está abierta, hacemos clic en la burbuja para abrirla
                const chatWindow = document.querySelector('.n8n-chat-window');
                if (!chatWindow || chatWindow.style.display === 'none' || chatWindow.style.opacity === '0') {
                    n8nChatToggleButton.click();
                }
            }
        };

        pedirCitaButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                e.preventDefault();
                // Esperamos un instante para que el script de n8n cree la burbuja
                setTimeout(openN8nChat, 100);
            });
        });
    });
    </script>
</body>
</html>
