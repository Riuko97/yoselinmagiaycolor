<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería - Yoselin Magia y Color</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500&family=Tangerine:wght@700&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="Logo.png">
    <link rel="apple-touch-icon" href="Logo.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-[#3A3226]">

    <header id="navbar-placeholder"></header>

    <main>
        <section class="bg-[#F5F1E9] pt-32 pb-16 sm:pt-40 sm:pb-24">
            <div class="max-w-screen-xl mx-auto px-6 lg:px-8 text-center">
                <h1 class="text-4xl md:text-5xl font-bold leading-tight tracking-tight">Nuestra Galería</h1>
                <p class="mt-4 text-lg md:text-xl max-w-3xl mx-auto text-[#6B5E4F]">Una muestra de los estilos, colores y sonrisas que creamos cada día.</p>
            </div>
        </section>

        <section id="galeria-fotos" class="py-16 sm:py-20 bg-[#FDFBF6]">
            <div class="max-w-screen-xl mx-auto px-6 lg:px-8">
                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
                    <div class="w-full h-full rounded-lg overflow-hidden shadow-lg">
                        <video class="object-cover w-full h-full" autoplay loop muted playsinline src="fotos_pelu/cambio mechas tradicionales.mp4"></video>
                    </div>
                    <div class="w-full h-full rounded-lg overflow-hidden shadow-lg">
                        <video class="object-cover w-full h-full" autoplay loop muted playsinline src="fotos_pelu/WhatsApp Video 2025-07-16 at 00.03.27.mp4"></video>
                    </div>
                    <div id="openModalBtn" class="w-full h-full rounded-lg overflow-hidden shadow-lg cursor-pointer group">
                        <img src="fotos_pelu/Cambio.jfif" alt="Ver antes y después" class="object-cover w-full h-full transform group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <div class="w-full h-full rounded-lg overflow-hidden shadow-lg"><img src="fotos_pelu/cambio 4.jpeg" alt="Trabajo de peluquería" class="object-cover w-full h-full"></div>
                    </div>
            </div>
        </section>

        <section class="py-20 sm:py-24 bg-[#F5F1E9]">
            <div class="max-w-screen-md mx-auto px-6 lg:px-8 text-center">
                <h2 class="text-3xl md:text-4xl font-bold">¿Te sientes inspirada?</h2>
                <a href="agenda.html" class="mt-8 inline-block btn-accent font-bold py-3 px-8 rounded-lg text-lg transform hover:scale-105">Reservar mi Cita</a>
            </div>
        </section>
    </main>

    <div id="imageModal" class="fixed inset-0 w-full h-full bg-black bg-opacity-80 flex justify-center items-center p-4 hidden z-50">
        <div class="bg-white rounded-lg shadow-2xl w-full max-w-4xl max-h-full overflow-y-auto relative">
            <button id="closeModalBtn" class="absolute top-2 right-4 text-black text-4xl font-bold hover:text-red-500 z-10">&times;</button>
            <h3 class="text-2xl font-bold p-4 border-b">Antes y Después</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 p-4">
                <div>
                    <p class="text-center font-semibold mb-2">ANTES</p>
                    <img src="fotos_pelu/antes.jfif" alt="Estado anterior del cabello" class="rounded-md w-full">
                </div>
                <div>
                    <p class="text-center font-semibold mb-2">DESPUÉS</p>
                    <img src="fotos_pelu/Cambio.jfif" alt="Resultado final del trabajo" class="rounded-md w-full">
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <div id="chat-placeholder"></div>

    <script src="script.js"></script>
</body>
</html>
